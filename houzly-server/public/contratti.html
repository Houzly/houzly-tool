<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Contratti · Houzly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4fa; --surface:#fff; --border:rgba(23,0,70,0.10);
  --text:#170046; --text-mid:rgba(23,0,70,0.62); --text-dim:rgba(23,0,70,0.40);
  --navy:#170046; --accent:#47a9e4; --clay:#4acbef;
  --green:#1a9a5a; --orange:#e0921a; --red:#d63a4a;
  --radius:16px; --radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Jost','DM Sans',sans-serif;font-size:15px;line-height:1.5}
.hidden{display:none!important}

/* ── login PIN ── */
#auth-screen{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.auth-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;letter-spacing:.02em}
.auth-sub{opacity:.62;font-size:14px;margin:6px 0 30px}
.pin-dots{display:flex;gap:14px;margin-bottom:34px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  transition:all .2s}
.pin-dot.filled{background:var(--clay);border-color:var(--clay);box-shadow:0 0 16px rgba(74,203,239,.9)}
.pin-grid{display:grid;grid-template-columns:repeat(3,74px);gap:15px}
.pin-btn{width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.07);color:#fff;font-family:'Jost',sans-serif;font-size:26px;
  font-weight:400;cursor:pointer;transition:transform .1s,background .15s}
.pin-btn:active{background:rgba(74,135,218,.4);transform:scale(.93)}
.pin-btn.del{font-size:18px;color:rgba(255,255,255,.7)}
.pin-btn.zero{grid-column:2}
#auth-err{height:22px;margin-top:18px;color:#ff9d9d;font-size:14px}

/* ── header ── */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:calc(var(--safe-top) + 14px) 18px 14px;position:sticky;top:0;z-index:20}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:900px;margin:0 auto}
.header-sub{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:17px;cursor:pointer}
.logout-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-mid);
  border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
/* Il modulo contratti vive su una pagina a sé: senza questo non c'è modo
   di tornare al gestionale se non riscrivendo l'indirizzo a mano. */
.torna-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-mid);
  border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;
  text-decoration:none;white-space:nowrap;display:inline-block}
.torna-btn:hover{background:var(--bg)}
@media(max-width:420px){.torna-btn{padding:8px 11px}
  .logout-btn{padding:8px 11px}}

main{max-width:900px;margin:0 auto;padding:18px 18px calc(var(--safe-bottom) + 40px)}

/* ── filtri ── */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;
  -webkit-overflow-scrolling:touch}
.pill{white-space:nowrap;border:1px solid var(--border);background:var(--surface);
  color:var(--text-mid);border-radius:20px;padding:8px 15px;font:inherit;font-size:13.5px;cursor:pointer}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── card pratica ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rif{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600}
.who{color:var(--text-mid);font-size:13.5px;margin-top:2px;word-break:break-word}
.stato{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.05em}
.s-bozza{background:rgba(23,0,70,.07);color:var(--text-mid)}
.s-inviata{background:rgba(71,169,228,.15);color:#1c6ea3}
.s-in_compilazione{background:rgba(224,146,26,.15);color:#8a5c05}
.s-firmata{background:rgba(26,154,90,.14);color:#116b3d}
.s-annullata{background:rgba(214,58,74,.12);color:#9c2231}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:12.5px;color:var(--text-dim)}
.azioni{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
  border-top:1px solid var(--border);padding-top:13px}
.az{border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}
.az.forte{background:var(--navy);color:#fff;border-color:var(--navy)}
.az.rischio{color:var(--red);border-color:rgba(214,58,74,.3)}
.az:disabled{opacity:.4;cursor:not-allowed}

/* ── form nuova ── */
.nuovo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:18px}
.nuovo h2{font-family:'Cormorant Garamond',serif;font-size:23px;margin:0 0 14px;font-weight:600}
label{display:block;margin-bottom:13px}
label>span{display:block;font-size:12.5px;font-weight:500;color:var(--text-mid);margin-bottom:5px}
input[type=text],input[type=email],input[type=number]{width:100%;padding:12px 13px;border:1px solid var(--border);
  border-radius:var(--radius-sm);font:inherit;font-size:16px;background:var(--bg);color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.tris{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media(max-width:560px){.duo,.tris{grid-template-columns:1fr}}
select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font:inherit;font-size:16px;background:var(--bg);color:var(--text);appearance:none}
textarea{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font:inherit;font-size:15px;background:var(--bg);color:var(--text);resize:vertical}
select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label>span em{font-style:normal;font-weight:400;color:var(--text-dim)}
.hint{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.45}
.sezione{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;margin:18px 0 10px;border-top:1px solid var(--border);padding-top:13px}
.check{display:flex;align-items:center;gap:11px;margin-bottom:15px;cursor:pointer}
.check input{width:21px;height:21px;accent-color:var(--navy);margin:0}
.check span{font-size:14px}
.primario{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.primario:disabled{opacity:.5}

.vuoto{text-align:center;padding:50px 20px;color:var(--text-dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--navy);
  color:#fff;padding:11px 20px;border-radius:22px;font-size:13.5px;opacity:0;
  transition:opacity .3s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
.toast.on{opacity:.95}
.filatore{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--navy);
  border-radius:50%;animation:gira .8s linear infinite;margin:40px auto}
@keyframes gira{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-title">Houzly</div>
  <div class="auth-sub">Inserisci il PIN per accedere</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-grid">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn del" onclick="pinDel()">⌫</button>
    <button class="pin-btn zero" onclick="pinPress('0')">0</button>
    <button class="pin-btn del" onclick="pinClear()">✕</button>
  </div>
  <div id="auth-err"></div>
</div>

<div id="app" class="hidden">
  <div class="app-header">
    <div class="header-row">
      <div class="header-sub">Contratti</div>
      <div style="display:flex;gap:9px;align-items:center">
        <a class="torna-btn" href="/" title="Torna a Houzly Tool">← Houzly Tool</a>
        <button class="icon-btn" onclick="pulizia()" title="Riallinea anagrafica">🧹</button>
        <button class="icon-btn" onclick="carica()" title="Aggiorna">↻</button>
        <button class="logout-btn" onclick="esci()">🔒 Esci</button>
      </div>
    </div>
  </div>

  <main>
    <div class="nuovo">
      <h2>Nuovo contratto di mandato</h2>

      <label><span>Mandante (proprietario)</span>
        <select id="n-owner" onchange="ownerScelto()">
          <option value="">— Nuovo proprietario, non ancora in anagrafica —</option>
        </select>
        <div class="hint" id="n-owner-hint">Scegliendo un proprietario esistente,
          compenso e profilo fiscale si precompilano dal suo profilo.</div></label>

      <label><span>Immobile</span>
        <select id="n-prop" onchange="propScelta()">
          <option value="">— Nuovo immobile, non ancora in anagrafica —</option>
        </select>
        <div class="hint">I dati catastali già noti arriveranno precompilati nel
          form del proprietario.</div></label>

      <label><span>Email a cui inviare il link *</span>
        <input type="email" id="n-email" autocapitalize="none" spellcheck="false"
          placeholder="proprietario@esempio.it"></label>
      <label><span>Nome della struttura</span>
        <input type="text" id="n-struttura" placeholder="es. Villa La Poggetta"></label>

      <div class="sezione">Condizioni economiche e clausole variabili</div>

      <div class="duo">
        <label><span>Compenso Houzly (%) *</span>
          <input type="number" id="n-perc" step="0.5" min="0" max="50" value="30"></label>
        <label><span>Regime IVA del compenso</span>
          <select id="n-iva">
            <option value="inclusa">IVA inclusa nella %</option>
            <option value="esclusa">% + IVA 22%</option>
          </select></label>
      </div>

      <label><span>Tipo di soggetto e ritenuta</span>
        <select id="n-soggetto" onchange="soggettoCambiato()">
          <option value="persona_fisica">Persona fisica — ritenuta 21% (Houzly sostituto d'imposta)</option>
          <option value="azienda">Società o ditta — nessuna ritenuta, fattura in proprio</option>
        </select>
        <div class="hint" id="n-soggetto-hint"></div></label>

      <div class="tris">
        <label><span>Durata (anni)</span>
          <input type="number" id="n-durata" min="1" max="5" value="1"></label>
        <label><span>Preavviso recesso (mesi)</span>
          <input type="number" id="n-preavviso" min="1" max="12" value="6"></label>
        <label><span>Soglia spesa autonoma (€)</span>
          <input type="number" id="n-soglia" min="0" step="10" value="50"></label>
      </div>

      <div class="sezione">Servizi accessori inclusi nel mandato (art. 11-bis)</div>
      <label class="check"><input type="checkbox" id="n-verde">
        <span>Gestione del verde — giardino, prato, siepi, irrigazione</span></label>
      <label class="check"><input type="checkbox" id="n-piscina">
        <span>Gestione della piscina — acque, pulizia, apertura e chiusura</span></label>

      <label><span>Pattuizioni particolari <em>— diventano l'Art. 20</em></span>
        <textarea id="n-extra" rows="3"
          placeholder="Es. decorrenza differita, scadenza fissa senza rinnovo, deroghe concordate…"></textarea>
        <div class="hint">Testo libero, scritto da voi. Nel contratto compare come
          articolo finale, con la clausola che lo fa prevalere sulle condizioni
          generali in caso di contrasto.</div></label>

      <div class="hint" style="margin:14px 0 10px">
        Luogo della firma: <strong>Terranuova Bracciolini</strong> (sede Houzly).
        La data è quella in cui il proprietario firma davvero.</div>

      <button class="primario" id="n-btn" onclick="crea()">Crea e invia l'invito</button>
    </div>

    <div class="pills" id="pills"></div>
    <div id="elenco"><div class="filatore"></div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* Con i campi anagrafici separati `nomeCognome` non esiste più: nelle
   pratiche nuove va ricomposto, altrimenti l'elenco mostrerebbe un
   indirizzo email al posto del nome del proprietario. */
function nomeMandante(m){
  if(!m) return '';
  const pezzi=[m.nome,m.cognome].filter(x=>x&&String(x).trim()).join(' ');
  return pezzi || m.ragioneSociale || m.nomeCognome || '';
}

const AUTH_KEY = 'houzly_auth_v2';
const PIN_KEY  = 'houzly_contratti_pin';   // sessionStorage: si svuota alla chiusura della scheda
const PIN_TOOL = 'onbPin';                 // stessa chiave usata da index.html

/**
 * Il PIN può arrivare da qui o dalla sessione già aperta nel gestionale:
 * le due pagine stanno sullo stesso dominio, quindi condividono
 * sessionStorage. Chi arriva dal pulsante "Contratti" non lo ridigita.
 */
function leggiPin(){
  try{ return sessionStorage.getItem(PIN_KEY) || sessionStorage.getItem(PIN_TOOL) || ''; }
  catch(e){ return ''; }
}

const STATI = [
  ['', 'Tutte'], ['inviata','Inviate'], ['in_compilazione','In compilazione'],
  ['firmata','Firmate'], ['bozza','Bozze'], ['annullata','Annullate'],
];
const ETICHETTE = {bozza:'Bozza', inviata:'Inviata', in_compilazione:'In compilazione',
  firmata:'Firmata', annullata:'Annullata'};

let filtro = '';
let pratiche = [];

/* ── login ─────────────────────────────────────────────────────── */

let pinBuffer = '';

function pinPress(d){
  if(pinBuffer.length >= 10) return;
  pinBuffer += d; aggiornaPunti();
  if(pinBuffer.length >= 4) setTimeout(login, 180);
}
function pinDel(){ pinBuffer = pinBuffer.slice(0,-1); aggiornaPunti(); }
function pinClear(){ pinBuffer = ''; aggiornaPunti(); }
function aggiornaPunti(){
  for(let i=0;i<4;i++)
    document.getElementById('d'+i).classList.toggle('filled', i < pinBuffer.length);
}
function erroreAuth(m){
  document.getElementById('auth-err').textContent = m;
  setTimeout(()=>{document.getElementById('auth-err').textContent='';}, 2200);
}

async function login(){
  try{
    const r = await fetch('/api/auth/login',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:pinBuffer})});
    const d = await r.json();
    if(d.ok){
      // Il PIN resta in sessionStorage perché /api/contracts è protetto lato server
      // e richiede l'header X-Admin-PIN a ogni chiamata. Alla chiusura della
      // scheda sparisce: non finisce in localStorage né in cronologia.
      sessionStorage.setItem(PIN_KEY, pinBuffer);
      localStorage.setItem(AUTH_KEY, '1');
      pinBuffer = ''; aggiornaPunti();
      entra();
    }else{
      erroreAuth('PIN errato'); pinBuffer=''; aggiornaPunti();
    }
  }catch(e){ erroreAuth('Errore di connessione'); pinBuffer=''; aggiornaPunti(); }
}

function entra(){
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  disegnaPills();
  soggettoCambiato();
  caricaAnagrafiche();
  carica();
}

function esci(){
  sessionStorage.removeItem(PIN_KEY);
  try{ sessionStorage.removeItem(PIN_TOOL); }catch(e){}
  localStorage.removeItem(AUTH_KEY);
  // Si torna al gestionale invece di ricaricare questa pagina: uscire dai
  // contratti vuol dire uscire da tutto, e ricaricando qui si restava davanti
  // alla richiesta del PIN del modulo, senza una via d'uscita.
  location.href = '/';
}

/* ── chiamate API ──────────────────────────────────────────────── */

async function api(percorso, opzioni = {}){
  const pin = leggiPin();
  const r = await fetch('/api/contracts' + percorso, {
    ...opzioni,
    headers: {'Content-Type':'application/json', 'X-Admin-PIN': pin || '', ...(opzioni.headers||{})},
  });
  if(r.status === 401){
    // Sessione persa (scheda riaperta, PIN cambiato): si rientra dal PIN.
    sessionStorage.removeItem(PIN_KEY);
    try{ sessionStorage.removeItem(PIN_TOOL); }catch(e){}
    localStorage.removeItem(AUTH_KEY);
    location.reload();
    throw new Error('non autorizzato');
  }
  return r.json();
}

/* ── elenco ────────────────────────────────────────────────────── */

function disegnaPills(){
  document.getElementById('pills').innerHTML = STATI.map(([v,l]) =>
    `<button class="pill${v===filtro?' on':''}" onclick="setFiltro('${v}')">${l}</button>`).join('');
}
function setFiltro(v){ filtro = v; disegnaPills(); disegnaElenco(); }

async function carica(){
  document.getElementById('elenco').innerHTML = '<div class="filatore"></div>';
  try{
    const d = await api('');
    if(!d.ok) return mostra('Errore: ' + d.error);
    pratiche = d.pratiche || [];
    disegnaElenco();
  }catch(e){ /* il reload è già partito in api() */ }
}

function disegnaElenco(){
  const lista = filtro ? pratiche.filter(p => p.stato === filtro) : pratiche;
  const el = document.getElementById('elenco');

  if(!lista.length){
    el.innerHTML = '<div class="vuoto">Nessuna pratica' +
      (filtro ? ' in questo stato' : ' ancora creata') + '.</div>';
    return;
  }

  el.innerHTML = lista.map(p => {
    const nome = nomeMandante(p.mandante) || p.email;
    const firmata = p.stato === 'firmata';
    const chiusa  = firmata || p.stato === 'annullata';
    const nAll = (p.allegati || []).length;

    const meta = [];
    if(p.nomeStruttura) meta.push('🏠 ' + esc(p.nomeStruttura));
    if(p.createdAt) meta.push('creata ' + dataIt(p.createdAt));
    if(firmata && p.pdfFinale) meta.push('firmata ' + dataIt(p.pdfFinale.generatoIl));
    if(nAll) meta.push(nAll + (nAll === 1 ? ' allegato' : ' allegati'));
    if(!chiusa && p.scadenzaAt) meta.push('scade ' + dataIt(p.scadenzaAt));

    return `
    <div class="card">
      <div class="card-top">
        <div style="min-width:0">
          <div class="rif">${esc(p.riferimento)}</div>
          <div class="who">${esc(nome)}</div>
        </div>
        <div class="stato s-${p.stato}">${ETICHETTE[p.stato] || p.stato}</div>
      </div>
      <div class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
      <div class="azioni">
        ${firmata
          ? `<button class="az forte" onclick="scaricaPdf('${p.riferimento}')">Scarica il PDF</button>
             <button class="az" onclick="riallinea('${p.riferimento}')">Riallinea anagrafiche</button>`
          : chiusa ? ''
          : `<button class="az forte" onclick="rigenera('${p.riferimento}')">Nuovo link e invio</button>
             <button class="az rischio" onclick="annulla('${p.riferimento}')">Annulla</button>`}
        ${firmata ? '' : `<button class="az" onclick="anteprima('${p.riferimento}')">Vedi il contratto</button>`}
        ${nAll ? `<button class="az" onclick="documenti('${p.riferimento}')">Documenti</button>` : ''}
        <button class="az" onclick="dettaglio('${p.riferimento}')">Dettagli</button>
        <button class="az rischio" onclick="elimina('${p.riferimento}')">Elimina</button>
      </div>
    </div>`;
  }).join('');
}

/* ── azioni ────────────────────────────────────────────────────── */

/* ── anagrafiche: tendine mandante e immobile ───────────────────── */

const V = (id) => { const e = document.getElementById(id); return e ? String(e.value).trim() : ''; };

let ANAG = { proprietari: [], proprieta: [] };

async function caricaAnagrafiche(){
  try{
    const d = await api('/anagrafiche');
    if(!d.ok) return;
    ANAG = d;
    const so = document.getElementById('n-owner');
    so.innerHTML = '<option value="">— Nuovo proprietario, non ancora in anagrafica —</option>' +
      d.proprietari.map(o => `<option value="${esc(o.id)}">${esc(o.etichetta)}` +
        (o.tipo === 'azienda' ? ' (azienda)' : '') + '</option>').join('');
    propScelta();
  }catch(e){ /* la pagina resta usabile: si crea tutto da zero */ }
}

/**
 * Scelto il mandante, si precompila ciò che il suo profilo già sa e si
 * restringe l'elenco immobili ai suoi: così non si lega per sbaglio la casa
 * di un proprietario al contratto di un altro.
 */
function ownerScelto(){
  const id = V('n-owner');
  const o = ANAG.proprietari.find(x => x.id === id);
  const hint = document.getElementById('n-owner-hint');

  if(o){
    if(o.houzlyPerc != null) document.getElementById('n-perc').value = o.houzlyPerc;
    document.getElementById('n-iva').value = o.ivaEsclusa ? 'esclusa' : 'inclusa';
    document.getElementById('n-soggetto').value = o.tipo === 'azienda' ? 'azienda' : 'persona_fisica';
    if(o.email && !V('n-email')) document.getElementById('n-email').value = o.email;
    hint.textContent = 'Compenso e profilo fiscale precompilati dall\u2019anagrafica. Puoi modificarli: il contratto fa fede.';
  }else{
    hint.textContent = 'Il proprietario verrà creato in anagrafica al momento della firma.';
  }
  soggettoCambiato();
  riempiImmobili();
}

function riempiImmobili(){
  const ownerId = V('n-owner');
  const sel = document.getElementById('n-prop');
  const precedente = sel.value;
  const lista = ownerId
    ? ANAG.proprieta.filter(p => p.ownerId === ownerId)
    : ANAG.proprieta;
  sel.innerHTML = '<option value="">— Nuovo immobile, non ancora in anagrafica —</option>' +
    lista.map(p => `<option value="${esc(p.id)}">${esc(p.nome)}</option>`).join('');
  if(lista.some(p => p.id === precedente)) sel.value = precedente;
  propScelta();
}

function propScelta(){
  const p = ANAG.proprieta.find(x => x.id === V('n-prop'));
  const nome = document.getElementById('n-struttura');
  if(p && !nome.value.trim()) nome.value = p.nome;
}

function soggettoCambiato(){
  const azienda = V('n-soggetto') === 'azienda';
  document.getElementById('n-soggetto-hint').textContent = azienda
    ? 'Art. 8 nella versione per soggetti d\u2019impresa: niente ritenuta, Houzly predispone la prefattura e il commercialista emette la fattura elettronica.'
    : 'Art. 8 standard: Houzly opera la ritenuta del 21%, versa con F24 e trasmette CU e 770.';
}

async function crea(){
  const email = document.getElementById('n-email').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return mostra('Email non valida');

  const btn = document.getElementById('n-btn');
  btn.disabled = true; btn.textContent = 'Creazione…';

  try{
    const soggetto = V('n-soggetto');
    const d = await api('', {method:'POST', body: JSON.stringify({
      email,
      nomeStruttura: V('n-struttura') || null,
      ownerId: V('n-owner') || null,
      propertyId: V('n-prop') || null,
      // Il tipo soggetto lo decide il backoffice: comanda la ritenuta e
      // quale versione dell'art. 8 finisce nel contratto.
      mandante: { tipoSoggetto: soggetto },
      condizioni:{
        compensoPerc: V('n-perc'),
        regimeIvaCodice: V('n-iva'),
        ritenuta: soggetto === 'persona_fisica',
        durataAnni: V('n-durata'),
        preavvisoRecesso: V('n-preavviso'),
        sogliaSpesa: V('n-soglia'),
        pattuizioni: V('n-extra'),
        verde: document.getElementById('n-verde').checked,
        piscina: document.getElementById('n-piscina').checked,
      },
    })});

    if(!d.ok) return mostra('Errore: ' + d.error);

    // Il link in chiaro non è più recuperabile dopo questa risposta:
    // se l'email non è partita, va copiato adesso.
    if(d.emailInviata){
      mostra(d.riferimento + ' creata, invito inviato');
    }else{
      await copia(d.link);
      mostra('Creata, ma email NON inviata — link copiato negli appunti');
    }

    ['n-email','n-struttura','n-extra'].forEach(id => { document.getElementById(id).value = ''; });
    ['n-verde','n-piscina'].forEach(id => { document.getElementById(id).checked = false; });
    document.getElementById('n-owner').value = '';
    document.getElementById('n-prop').value = '';
    propScelta();
    carica();
  }catch(e){ /* reload già partito */ }
  finally{ btn.disabled = false; btn.textContent = 'Crea e invia l\u2019invito'; }
}

async function rigenera(rif){
  if(!confirm('Genera un nuovo link e invia di nuovo l\u2019email?\n\nIl link precedente smetterà di funzionare.')) return;
  const d = await api('/' + rif + '/rigenera-link', {method:'POST'});
  if(!d.ok) return mostra('Errore: ' + d.error);
  if(d.emailInviata) mostra('Nuovo invito inviato');
  else { await copia(d.link); mostra('Email non inviata — link copiato negli appunti'); }
  carica();
}

/* Rilancia il write-back su una pratica già firmata.
   Serve quando l'anagrafica è rimasta indietro: write-back fallito, oppure
   girato con una versione che scriveva i comproprietari nel posto sbagliato.
   Si può premere più volte senza duplicare niente. */
async function riallinea(rif){
  if(!confirm('Riscrivere proprietario, immobile e riga di contratto in anagrafica da questa pratica firmata?\n\nNon cancella niente e non crea doppioni: aggiorna quello che c\u2019e\u0300 e aggiunge quello che manca.')) return;
  mostra('Riallineamento in corso\u2026');
  const d = await api('/' + rif + '/write-back', {method:'POST'});
  if(!d.ok){
    return mostra(d.error==='pratica_non_firmata'
      ? 'Si riallinea solo da una pratica firmata'
      : 'Errore: ' + d.error);
  }
  const e = d.esito || {};
  const pezzi = [
    e.ownerCreato ? 'proprietario creato' : 'proprietario aggiornato',
    e.propCreata ? 'immobile creato' : 'immobile aggiornato',
  ];
  if(e.coprops) pezzi.push(e.coprops + (e.coprops===1?' comproprietario':' comproprietari'));
  pezzi.push('riga di contratto scritta');
  mostra('Fatto: ' + pezzi.join(', '));
  const m = d.campiFiscaliMancanti || [];
  if(m.length) setTimeout(()=>alert(
    'Riallineamento fatto.\n\nRestano vuoti alcuni campi che servono a DAC7, CU o 770:\n\n· '
    + m.join('\n· ')
    + '\n\nSi completano a mano in houzly-tool, nella scheda del proprietario o dell\u2019immobile.'), 600);
}

async function annulla(rif){
  const motivo = prompt('Annullare la pratica ' + rif + '?\n\nMotivo (facoltativo):');
  if(motivo === null) return;
  const d = await api('/' + rif + '/annulla', {method:'POST', body: JSON.stringify({motivo})});
  if(!d.ok) return mostra('Errore: ' + d.error);
  mostra('Pratica annullata');
  carica();
}

async function scaricaPdf(rif){
  // Il PDF si scarica con fetch e l'header X-Admin-PIN, non aprendo un link
  // con ?pin= nella query: quello finirebbe nella cronologia del browser e
  // nei log di Render. Il blob viene poi aperto in una scheda nuova.
  mostra('Preparazione del PDF…');
  try{
    const pin = leggiPin();
    const r = await fetch('/api/contracts/' + rif + '/pdf', {headers:{'X-Admin-PIN':pin}});
    if(!r.ok) return mostra('PDF non disponibile');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'contratto-' + rif + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ mostra('Errore nello scaricamento'); }
}

async function anteprima(rif){
  // La scheda si apre PRIMA della fetch: aperta dopo l'await, Safari la
  // considera non originata da un click e la blocca come popup.
  const scheda = window.open('', '_blank');
  if(scheda) scheda.document.write(paginaAttesa(rif));
  mostra('Generazione del contratto…');

  try{
    const pin = leggiPin();
    const r = await fetch('/api/contracts/' + rif + '/anteprima', {headers:{'X-Admin-PIN':pin}});

    if(!r.ok){
      const testo = await r.text();
      let msg = 'HTTP ' + r.status;
      try{ const d = JSON.parse(testo); if(d.error) msg = d.error; }catch(e){}
      if(scheda) scheda.close();
      return mostra('Non disponibile: ' + msg);
    }

    const blob = await r.blob();
    if(!blob.size){
      if(scheda) scheda.close();
      return mostra('Il server ha restituito un file vuoto');
    }

    const url = URL.createObjectURL(blob);

    if(!scheda){
      // Popup bloccato dal browser: si ripiega sullo scaricamento.
      scaricaBlob(url, rif);
      mostra('Popup bloccato — contratto scaricato');
      return;
    }

    // Il PDF si mostra dentro un <embed> scritto nella scheda, invece di
    // navigarla su un indirizzo blob:. Chrome blocca quella navigazione da
    // qualche versione e il risultato è esattamente una pagina bianca.
    scheda.document.open();
    scheda.document.write(paginaPdf(url, rif));
    scheda.document.close();

    setTimeout(()=>URL.revokeObjectURL(url), 10 * 60 * 1000);
  }catch(e){
    if(scheda) scheda.close();
    mostra('Errore nella generazione');
  }
}

function scaricaBlob(url, rif){
  const a = document.createElement('a');
  a.href = url; a.download = rif + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
}

function paginaAttesa(rif){
  return `<!doctype html><html lang="it"><head><meta charset="utf-8">
    <title>${esc(rif)} · Houzly</title></head>
    <body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;
      font-family:system-ui,sans-serif;color:#170046;background:#f0f4fa">
      Generazione del contratto…</body></html>`;
}

function paginaPdf(url, rif){
  // Oltre all'anteprima c'è sempre un link di scaricamento: su iOS Safari
  // l'<embed> di un PDF spesso non renderizza e resterebbe solo il bianco.
  return `<!doctype html><html lang="it"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(rif)} · Houzly</title></head>
    <body style="margin:0;background:#525659;font-family:system-ui,sans-serif">
      <div style="background:#170046;color:#fff;padding:10px 16px;display:flex;
        justify-content:space-between;align-items:center;gap:16px">
        <span style="font-size:14px">${esc(rif)}</span>
        <a href="${url}" download="${esc(rif)}.pdf"
          style="color:#fff;font-size:13px;text-decoration:underline">Scarica il PDF</a>
      </div>
      <embed src="${url}" type="application/pdf"
        style="width:100%;height:calc(100vh - 41px);border:0">
    </body></html>`;
}

/* Apre l'elenco dei documenti raccolti in una scheda a parte.
   I link passano dal server, che firma l'URL al momento: non si mettono in
   pagina URL di R2 a lunga scadenza per dei documenti d'identità. */
async function documenti(rif){
  const d = await api('/' + rif + '/allegati');
  if(!d.ok) return mostra('Errore: ' + d.error);
  const a = d.allegati || [];
  if(!a.length) return mostra('Nessun documento caricato');

  const pin = encodeURIComponent(leggiPin());
  const righe = a.map(x => {
    const url = '/api/contracts/' + encodeURIComponent(rif) + '/allegato/' + x.indice + '?pin=' + pin;
    const chi = x.chi ? ' — ' + esc(x.chi) : '';
    const avviso = x.valido === false
      ? ' <span style="color:#9c2231;font-size:12px">(caricato per un’altra persona: da rifare)</span>'
      : '';
    return '<li style="margin:7px 0"><a href="' + url + '" target="_blank" rel="noopener">'
      + esc(x.nome) + chi + '</a> <span style="color:#777;font-size:12px">' + x.kb + ' KB</span>'
      + avviso + '</li>';
  }).join('');

  const w = window.open('', '_blank');
  if(!w) return mostra('Il browser ha bloccato la finestra');
  w.document.write('<!doctype html><html lang="it"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>Documenti ' + esc(rif) + '</title>'
    + '<style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;'
    + 'margin:0;padding:28px 20px;color:#1a1a1a;max-width:620px}'
    + 'h1{font-size:18px;margin:0 0 4px}p{color:#666;font-size:13px;margin:0 0 18px}'
    + 'ul{padding-left:20px}a{color:#0b6b5e}</style></head><body>'
    + '<h1>Documenti — ' + esc(rif) + '</h1>'
    + '<p>I link si aprono in una scheda nuova e scadono dopo pochi minuti: '
    + 'se uno non funziona più, torni qui e lo riapra.</p>'
    + '<ul>' + righe + '</ul></body></html>');
  w.document.close();
}

/**
 * Elimina una pratica e tutto quello che ha scritto in anagrafica.
 *
 * Prima si chiede al server cosa sparirebbe davvero e lo si mette nero su
 * bianco: "elimina il contratto" non dice se se ne va anche il proprietario,
 * e una prova fatta su un proprietario vero non deve portarselo via.
 * La conferma è il riferimento battuto a mano, non un sì.
 */
/**
 * Riallinea l'anagrafica dopo che sono state eliminate delle pratiche.
 *
 * L'eliminazione di una pratica si porta via quello che aveva creato, ma
 * qualcosa può restare indietro: una riga di contratto cancellata a mano
 * dal gestionale, un immobile che al momento dell'eliminazione risultava
 * ancora usato da una prenotazione poi rimossa. Questo tasto li ritrova.
 *
 * Due gruppi, tenuti distinti apposta: i residui con la firma di una pratica
 * sparita, di cui si sa la provenienza, e le schede che semplicemente non
 * usa nessuno — che potrebbero anche essere un proprietario inserito a
 * mano e non ancora attivo. Il secondo gruppo si elenca e basta.
 */
async function pulizia(){
  const a = await api('/pulizia');
  if(!a.ok) return mostra('Errore: ' + a.error);
  const p = a.anteprima || {};

  const nomi = (v, max) => v.slice(0, max || 6).map(x => x.nome || x.proprietario || x.id).join(', ')
    + (v.length > (max || 6) ? ' e altri ' + (v.length - (max || 6)) : '');

  const certi = [];
  if(p.contrattiOrfani.length)
    certi.push(p.contrattiOrfani.length + ' righe di contratto senza pratica — ' + nomi(p.contrattiOrfani));
  if(p.immobiliOrfani.length)
    certi.push(p.immobiliOrfani.length + ' immobili creati da pratiche eliminate — ' + nomi(p.immobiliOrfani));
  if(p.proprietariOrfani.length)
    certi.push(p.proprietariOrfani.length + ' proprietari creati da pratiche eliminate — ' + nomi(p.proprietariOrfani));

  const dubbi = [].concat(p.immobiliInutilizzati, p.proprietariInutilizzati);

  if(!certi.length && !dubbi.length) return mostra('Anagrafica in ordine, nessun residuo');

  let testo = '';
  if(certi.length) testo += 'Residui di pratiche eliminate:\n\n· ' + certi.join('\n· ') + '\n\n';

  let immobili = p.immobiliOrfani.map(x => x.id);
  let proprietari = p.proprietariOrfani.map(x => x.id);

  if(certi.length){
    testo += 'Niente di tutto questo è usato da prenotazioni, ricevute o altri contratti: '
      + 'quello che risulta ancora in uso viene saltato.\n\nProcedere con la rimozione?';
    if(!confirm(testo)) return;
  }

  /* Secondo gruppo: schede che non usa nessuno ma senza firma di provenienza.
     Si chiedono a parte, con i nomi davanti, perché qui la certezza non
     c'è: possono essere prove fatte prima che la firma esistesse, oppure un
     prospect censito a mano e non ancora attivo. */
  if(dubbi.length){
    const elenco = dubbi.map(x => '\u00b7 ' + (x.nome || x.id)).join('\n');
    const vuole = confirm('Ci sono ' + dubbi.length + ' schede che non usa nessuno, senza traccia '
      + 'della pratica che le ha create:\n\n' + elenco
      + '\n\nPossono essere residui di prove fatte prima, oppure anagrafiche inserite a mano e '
      + 'non ancora attive.\n\nRimuovere anche queste? Scelga Annulla se riconosce qualcosa da tenere.');
    if(vuole){
      immobili = immobili.concat(p.immobiliInutilizzati.map(x => x.id));
      proprietari = proprietari.concat(p.proprietariInutilizzati.map(x => x.id));
    } else if(!certi.length){
      return mostra('Nessuna modifica');
    }
  }

  mostra('Pulizia in corso\u2026');
  const d = await api('/pulizia', {method:'POST', body: JSON.stringify({
    conferma: 'PULISCI',
    contratti: p.contrattiOrfani.map(x => x.id),
    immobili,
    proprietari,
  })});
  if(!d.ok) return mostra('Errore: ' + d.error);

  const fatto = [];
  if(d.contratti) fatto.push(d.contratti + ' righe di contratto');
  if(d.immobili) fatto.push(d.immobili + ' immobili');
  if(d.proprietari) fatto.push(d.proprietari + ' proprietari');
  mostra(fatto.length ? 'Rimossi: ' + fatto.join(', ') : 'Niente da rimuovere');
  if(d.rifiutati && d.rifiutati.length)
    setTimeout(()=>alert(d.rifiutati.length + ' elementi non sono stati rimossi perché nel '
      + 'frattempo risultano usati da qualcos’altro.'), 500);
}

async function elimina(rif){
  const a = await api('/' + rif + '/eliminazione');
  if(!a.ok) return mostra('Errore: ' + a.error);
  const p = a.anteprima || {};

  const voci = ['la pratica ' + rif + ' e la sua cronologia'];
  if(p.fileR2) voci.push(p.fileR2 + (p.fileR2 === 1 ? ' file archiviato' : ' file archiviati')
    + ' (contratto firmato e documenti)');
  if(p.rigaContratto) voci.push('la riga nella sezione Contratti');
  if(p.coprops && p.coprops.length)
    voci.push('i co-proprietari aggiunti da questa pratica: ' + p.coprops.join(', '));
  if(p.immobile && p.immobile.eliminabile) voci.push('l’immobile “' + p.immobile.nome + '”');
  if(p.proprietario && p.proprietario.eliminabile)
    voci.push('il proprietario “' + p.proprietario.nome + '”');

  const tenuti = [];
  if(p.immobile && !p.immobile.eliminabile)
    tenuti.push('l’immobile “' + p.immobile.nome + '”, perché è usato altrove');
  if(p.proprietario && !p.proprietario.eliminabile)
    tenuti.push('il proprietario “' + p.proprietario.nome + '”, perché è usato altrove');

  let testo = 'Verranno eliminati:\n\n· ' + voci.join('\n· ');
  if(tenuti.length) testo += '\n\nRestano invece:\n· ' + tenuti.join('\n· ');
  if(!p.immobile && !p.proprietario)
    testo += '\n\nProprietario e immobile non vengono toccati: erano già in anagrafica prima di questa pratica.';
  testo += '\n\nL’operazione non si può annullare.';

  if(p.stato === 'firmata'){
    testo = '⚠ Questa pratica è FIRMATA: sta per cancellare un contratto sottoscritto '
      + 'e la sua copia archiviata.\n\n' + testo
      + '\n\nPer confermare scriva il riferimento: ' + rif;
    const scritto = prompt(testo, '');
    if((scritto || '').trim().toUpperCase() !== rif.toUpperCase()) return mostra('Eliminazione annullata');
  } else {
    if(!confirm(testo)) return;
  }

  mostra('Eliminazione in corso…');
  const d = await api('/' + rif, {method:'DELETE', body: JSON.stringify({conferma: rif})});
  if(!d.ok){
    return mostra(d.error === 'conferma_mancante' ? 'Conferma non valida' : 'Errore: ' + d.error);
  }

  const fatto = ['pratica eliminata'];
  if(d.fileTotali) fatto.push(d.fileRimossi + '/' + d.fileTotali + ' file');
  if(d.rigaContratto) fatto.push('riga di contratto');
  if(d.coprops) fatto.push(d.coprops + ' co-proprietari');
  if(d.immobile) fatto.push('immobile');
  if(d.proprietario) fatto.push('proprietario');
  mostra(fatto.join(', '));
  if(d.tenuti && d.tenuti.length)
    setTimeout(()=>alert('Non è stato rimosso:\n\n· ' + d.tenuti.join('\n· ')
      + '\n\nSono dati usati anche altrove: vanno tolti a mano da houzly-tool, se serve.'), 500);
  carica();
}

async function dettaglio(rif){
  const d = await api('/' + rif);
  if(!d.ok) return mostra('Errore: ' + d.error);
  const p = d.pratica;
  const righe = [];
  righe.push('Stato: ' + (ETICHETTE[p.stato] || p.stato));
  righe.push('Email: ' + p.email);
  const _int = nomeMandante(p.mandante);
  if(_int) righe.push('Intestatario: ' + _int);
  const _cf = p.mandante && (p.mandante.cf || p.mandante.piva || p.mandante.cfPiva);
  if(_cf) righe.push('CF/P.IVA: ' + _cf);
  if(p.immobile && p.immobile.indirizzo) righe.push('Immobile: ' + p.immobile.indirizzo);
  if(p.pdfFinale) righe.push('SHA-256: ' + p.pdfFinale.sha256);
  righe.push('');
  righe.push('Cronologia:');
  (p.audit || []).forEach(a => righe.push('· ' + dataIt(a.ts) + ' — ' + a.evento));
  alert(righe.join('\n'));
}

/* ── utilità ───────────────────────────────────────────────────── */

async function copia(testo){
  try{ await navigator.clipboard.writeText(testo); }
  catch(e){ prompt('Copi il link a mano:', testo); }
}

function mostra(t){
  const e = document.getElementById('toast');
  e.textContent = t; e.classList.add('on');
  setTimeout(()=>e.classList.remove('on'), 3200);
}

function dataIt(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
